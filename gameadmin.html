<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Usuários</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background-color: #1e1e1e; padding: 20px; border-radius: 8px; }
        h2 { margin-top: 0; }
        
        .actions-bar { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        input[type="text"] { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; width: 60%; }
        button.btn-add { background-color: #2e7d32; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
        th { background-color: #2a2a2a; }
        
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.active { background-color: #1b5e20; color: #a5d6a7; }
        .status.inactive { background-color: #b71c1c; color: #ef9a9a; }
        
        .btn-action { border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px; }
        .btn-toggle { background-color: #0288d1; color: white; }
        .btn-delete { background-color: #d32f2f; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel Administrativo - Gerenciamento de Usuários</h2>
        
        <div class="actions-bar">
            <input type="text" id="search-input" placeholder="Buscar por nome ou e-mail..." onkeyup="filterUsers()">
            <button class="btn-add" onclick="addUser()">+ Novo Usuário</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                <!-- Linhas geradas via JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Dados de exemplo simulando um banco de dados
        let users = [
            { id: 1, name: "Carlos Silva", email: "carlos@email.com", active: true },
            { id: 2, name: "Ana Souza", email: "ana@email.com", active: true },
            { id: 3, name: "Pedro Rocha", email: "pedro@email.com", active: false }
        ];

        function renderUsers(data = users) {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            data.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>
                        <span class="status ${user.active ? 'active' : 'inactive'}">
                            ${user.active ? 'Ativo' : 'Bloqueado'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-action btn-toggle" onclick="toggleStatus(${user.id})">
                            ${user.active ? 'Bloquear' : 'Ativar'}
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteUser(${user.id})">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleStatus(id) {
            users = users.map(u => u.id === id ? { ...u, active: !u.active } : u);
            renderUsers();
        }

        function deleteUser(id) {
            if (confirm("Tem certeza que deseja remover este usuário?")) {
                users = users.filter(u => u.id !== id);
                renderUsers();
            }
        }

        function addUser() {
            const name = prompt("Nome do usuário:");
            const email = prompt("E-mail do usuário:");
            if (name && email) {
                const newId = users.length ? Math.max(...users.map(u => u.id)) + 1 : 1;
                users.push({ id: newId, name, email, active: true });
                renderUsers();
            }
        }

        function filterUsers() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = users.filter(u => 
                u.name.toLowerCase().includes(term) || u.email.toLowerCase().includes(term)
            );
            renderUsers(filtered);
        }

        // Inicializa a tabela
        renderUsers();
    </script>
</body>
</html>
