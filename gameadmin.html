<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Usuários</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background-color: #1e1e1e; padding: 20px; border-radius: 8px; }
        h2 { margin-top: 0; }
        .actions-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        input[type="text"] { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; width: 60%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
        th { background-color: #2a2a2a; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.active { background-color: #1b5e20; color: #a5d6a7; }
        .status.inactive { background-color: #f57f17; color: #fffde7; }
        .status.blocked { background-color: #b71c1c; color: #ef9a9a; }
        .btn-action { border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px; }
        .btn-toggle { background-color: #0288d1; color: white; }
        .btn-delete { background-color: #d32f2f; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel Administrativo - Gerenciamento de Usuários</h2>
        
        <div class="actions-bar">
            <input type="text" id="search-input" placeholder="Buscar por telefone ou nome..." onkeyup="filterUsers()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Tipo</th>
                    <th>Status Assinatura</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                <tr><td colspan="6">Carregando usuários...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://plataforma-jogos-jpz5.onrender.com';
        let allUsers = [];

        async function fetchUsers() {
            const token = localStorage.getItem('token');
            
            if (!token) {
                alert('Acesso negado! Faça login primeiro.');
                window.location.href = '/index.html';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/admin/users`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (res.status === 401 || res.status === 403) {
                    alert('Acesso negado. Apenas administradores podem visualizar esta página.');
                    window.location.href = '/index.html';
                    return;
                }

                allUsers = await res.json();
                renderUsers(allUsers);
            } catch (err) {
                alert('Erro ao carregar usuários do servidor!');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            if (!Array.isArray(users) || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">Nenhum usuário encontrado.</td></tr>';
                return;
            }

            users.forEach(user => {
                const subStatus = user.subscription_status || 'INACTIVE';
                const isBlocked = subStatus === 'BLOCKED';
                const isActive = subStatus === 'ACTIVE';

                let statusClass = 'inactive';
                let statusLabel = 'Inativo';

                if (isActive) {
                    statusClass = 'active';
                    statusLabel = 'Ativo';
                } else if (isBlocked) {
                    statusClass = 'blocked';
                    statusLabel = 'Bloqueado';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${user.id}</td>
                    <td>${user.name || 'Sem Nome'}</td>
                    <td>${user.phone || '-'}</td>
                    <td><strong>${user.role || 'USER'}</strong></td>
                    <td>
                        <span class="status ${statusClass}">
                            ${statusLabel}
                        </span>
                    </td>
                    <td>
                        <button class="btn-action btn-toggle" onclick="toggleStatus(${user.id}, '${subStatus}')">
                            ${isActive ? 'Bloquear/Inativar' : 'Ativar'}
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteUser(${user.id})">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleStatus(id, currentStatus) {
            const token = localStorage.getItem('token');
            const newStatus = currentStatus === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';

            try {
                const res = await fetch(`${API_URL}/admin/users/${id}/status`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (res.ok) {
                    fetchUsers();
                } else {
                    alert('Erro ao atualizar status do usuário.');
                }
            } catch (err) {
                alert('Erro de conexão ao atualizar status.');
            }
        }

        async function deleteUser(id) {
            const token = localStorage.getItem('token');
            
            if (confirm("Tem certeza que deseja remover este usuário do banco de dados?")) {
                try {
                    const res = await fetch(`${API_URL}/admin/users/${id}`, { 
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });

                    if (res.ok) {
                        fetchUsers();
                    } else {
                        alert('Erro ao excluir usuário.');
                    }
                } catch (err) {
                    alert('Erro de conexão ao excluir usuário.');
                }
            }
        }

        function filterUsers() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                (u.phone && u.phone.toLowerCase().includes(term)) ||
                (u.name && u.name.toLowerCase().includes(term))
            );
            renderUsers(filtered);
        }

        // Carrega a lista com validação assim que abre a página
        fetchUsers();
    </script>
</body>
</html>
