<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Usuários</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background-color: #1e1e1e; padding: 20px; border-radius: 8px; }
        h2 { margin-top: 0; }
        .actions-bar { display: flex; justify-content: space-between; margin-bottom: 20px; }
        input[type="text"] { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; width: 60%; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
        th { background-color: #2a2a2a; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.active { background-color: #1b5e20; color: #a5d6a7; }
        .status.blocked { background-color: #b71c1c; color: #ef9a9a; }
        .btn-action { border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-right: 5px; }
        .btn-toggle { background-color: #0288d1; color: white; }
        .btn-delete { background-color: #d32f2f; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel Administrativo - Gerenciamento de Usuários</h2>
        
        <div class="actions-bar">
            <input type="text" id="search-input" placeholder="Buscar por telefone..." onkeyup="filterUsers()">
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Telefone</th>
                    <th>Plano</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                <tr><td colspan="5">Carregando usuários...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://plataforma-jogos-jpz5.onrender.com';
        let allUsers = [];

        async function fetchUsers() {
            try {
                const res = await fetch(`${API_URL}/admin/users`);
                allUsers = await res.json();
                renderUsers(allUsers);
            } catch (err) {
                alert('Erro ao carregar usuários do servidor!');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">Nenhum usuário encontrado.</td></tr>';
                return;
            }

            users.forEach(user => {
                const isBlocked = user.status === 'blocked';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>#${user.id}</td>
                    <td>${user.phone}</td>
                    <td>R$ ${user.plan || '0'}</td>
                    <td>
                        <span class="status ${isBlocked ? 'blocked' : 'active'}">
                            ${isBlocked ? 'Bloqueado' : 'Ativo'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-action btn-toggle" onclick="toggleStatus(${user.id}, '${user.status}')">
                            ${isBlocked ? 'Ativar' : 'Bloquear'}
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteUser(${user.id})">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'blocked' ? 'active' : 'blocked';
            await fetch(`${API_URL}/admin/users/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            fetchUsers();
        }

        async function deleteUser(id) {
            if (confirm("Tem certeza que deseja remover este usuário?")) {
                await fetch(`${API_URL}/admin/users/${id}`, { method: 'DELETE' });
                fetchUsers();
            }
        }

        function filterUsers() {
            const term = document.getElementById('search-input').value.toLowerCase();
            const filtered = allUsers.filter(u => u.phone.toLowerCase().includes(term));
            renderUsers(filtered);
        }

        // Carrega os dados reais assim que a página abre
        fetchUsers();
    </script>
</body>
</html>
