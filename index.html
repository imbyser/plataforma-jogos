<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Jogos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h2 { margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-success { background-color: #28a745; color: white; }
    .btn-pay { 
      background-color: #ff9900; 
      color: white; 
      text-decoration: none; 
      display: block; 
      line-height: 44px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 12px;
    }
    .switch-mode {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
      cursor: pointer;
      text-decoration: underline;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card" id="authBox">
    <h2 id="formTitle">Login</h2>
    <input type="text" id="phoneInput" placeholder="Celular (ex: 81999999999)" />
    <input type="password" id="passwordInput" placeholder="Senha" />
    <input type="text" id="nameInput" placeholder="Seu Nome" class="hidden" />

    <button id="authBtn" class="btn-primary" onclick="handleAuth()">Entrar</button>
    
    <div class="switch-mode" id="toggleModeBtn" onclick="toggleMode()">
      Não tem conta? Cadastre-se
    </div>
  </div>

  <div class="card hidden" id="gameArea">
    <h2>Seu Jogo</h2>
    <p>Mensalidade: <strong style="color: #28a745;">R$ 60,00/mês</strong></p>
    
    <a id="payBtn" href="https://pay.kiwify.com.br/ry6ATnk" target="_blank" class="btn-pay">Pagar Assinatura (R$ 60,00)</a>
    
    <button class="btn-success" onclick="playGame()">Jogar Agora</button>
    <button style="background-color: #dc3545; color: white;" onclick="logout()">Sair</button>
  </div>

  <script>
    let isRegisterMode = false;

    function toggleMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('formTitle').innerText = isRegisterMode ? 'Cadastro' : 'Login';
      document.getElementById('authBtn').innerText = isRegisterMode ? 'Cadastrar' : 'Entrar';
      document.getElementById('nameInput').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('toggleModeBtn').innerText = isRegisterMode 
        ? 'Já tem conta? Faça Login' 
        : 'Não tem conta? Cadastre-se';
    }

    async function handleAuth() {
      const phone = document.getElementById('phoneInput').value;
      const password = document.getElementById('passwordInput').value;
      const name = document.getElementById('nameInput').value;

      const endpoint = isRegisterMode ? '/auth/register' : '/auth/login';
      const bodyData = isRegisterMode ? { name, phone, password } : { phone, password };

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyData)
      });

      const data = await response.json();

      if (response.ok) {
        if (!isRegisterMode) {
          localStorage.setItem('token', data.token);
          document.getElementById('authBox').classList.add('hidden');
          document.getElementById('gameArea').classList.remove('hidden');
        } else {
          alert('Cadastro realizado! Faça login para continuar.');
          toggleMode();
        }
      } else {
        alert(data.error || 'Erro na operação.');
      }
    }

    async function playGame() {
      const token = localStorage.getItem('token');
      const response = await fetch('/game/play', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      const data = await response.json();

      if (response.ok) {
        window.location.href = data.gameUrl;
      } else {
        alert(data.error || 'Assinatura ativa necessária para jogar.');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      location.reload();
    }
  </script>
</body>
</html>
