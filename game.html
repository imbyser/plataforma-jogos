<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Jogos - Área de Jogo</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; text-align: center; margin: 0; padding: 20px; }
        .nav-header { display: flex; justify-content: space-between; align-items: center; background-color: #333; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-header h2 { margin: 0; }
        .game-controls button { background-color: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin: 2px; font-size: 14px;}
        .game-controls button.active { background-color: #2e7d32; font-weight: bold; }
        .game-controls button:hover { background-color: #45a049; }
        .game-section { display: none; margin-top: 20px; }
        .game-section.active { display: block; }

        /* Estilos do Canvas dos Jogos */
        canvas { background-color: #000; border: 2px solid #555; display: block; margin: 20px auto; max-width: 100%; }
        
        /* Estilos Jogo da Memória */
        #memory-grid { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; justify-content: center; margin-top: 20px; }
        .card { width: 80px; height: 80px; background-color: #444; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 2em; color: transparent; user-select: none; transition: background-color 0.3s; }
        .card.flipped { background-color: #fff; color: #333; cursor: default; }
        .card.matched { background-color: #2e7d32; color: #fff; cursor: default; }

        /* Botões de Reinício */
        .restart-btn { background-color: #f44336; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 15px; font-size: 16px; display: none; }
        .restart-btn.show { display: inline-block; }
        .restart-btn:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

    <div class="nav-header">
        <h2>Área de Jogos</h2>
        <div class="game-controls">
            <button id="btn-flappy" class="active">Flappy Bird (R$ 50)</button>
            <button id="btn-nave">Jogo da Nave (R$ 100)</button>
            <button id="btn-memoria">Jogo da Memória (R$ 150)</button>
        </div>
    </div>

    <!-- 1. JOGO FLAPPY BIRD -->
    <div id="section-flappy" class="game-section active">
        <h3>Flappy Bird</h3>
        <p>Pressione a <strong>Barra de Espaço</strong> ou <strong>Clique na Tela</strong> para saltar.</p>
        <canvas id="flappyCanvas" width="360" height="480"></canvas>
        <button id="restart-flappy" class="restart-btn">Reiniciar Flappy Bird</button>
    </div>

    <!-- 2. JOGO DA NAVE -->
    <div id="section-nave" class="game-section">
        <h3>Jogo da Nave</h3>
        <p>Use as <strong>Setas (Esquerda/Direita)</strong> para mover e <strong>Barra de Espaço</strong> para atirar.</p>
        <canvas id="naveCanvas" width="400" height="400"></canvas>
        <button id="restart-nave" class="restart-btn">Reiniciar Jogo da Nave</button>
    </div>

    <!-- 3. JOGO DA MEMÓRIA -->
    <div id="section-memoria" class="game-section">
        <h3>Jogo da Memória</h3>
        <p>Encontre todos os pares de emoticons.</p>
        <div id="memory-grid"></div>
        <button id="restart-memoria" class="restart-btn">Reiniciar Jogo da Memória</button>
    </div>

    <script>
        // --- GERENCIADOR DE NAVEGAÇÃO DOS JOGOS ---
        const btnFlappy = document.getElementById('btn-flappy');
        const btnNave = document.getElementById('btn-nave');
        const btnMemoria = document.getElementById('btn-memoria');

        const secFlappy = document.getElementById('section-flappy');
        const secNave = document.getElementById('section-nave');
        const secMemoria = document.getElementById('section-memoria');

        function stopAllGames() {
            if (flappyLoop) cancelAnimationFrame(flappyLoop);
            if (naveLoop) cancelAnimationFrame(naveLoop);
        }

        function showGame(gameName) {
            stopAllGames();
            
            btnFlappy.classList.remove('active');
            btnNave.classList.remove('active');
            btnMemoria.classList.remove('active');

            secFlappy.classList.remove('active');
            secNave.classList.remove('active');
            secMemoria.classList.remove('active');

            if (gameName === 'flappy') {
                btnFlappy.classList.add('active');
                secFlappy.classList.add('active');
                startFlappy();
            } else if (gameName === 'nave') {
                btnNave.classList.add('active');
                secNave.classList.add('active');
                startNave();
            } else if (gameName === 'memoria') {
                btnMemoria.classList.add('active');
                secMemoria.classList.add('active');
                startMemoryGame();
            }
        }

        btnFlappy.addEventListener('click', () => showGame('flappy'));
        btnNave.addEventListener('click', () => showGame('nave'));
        btnMemoria.addEventListener('click', () => showGame('memoria'));


        // --- 1. LÓGICA FLAPPY BIRD ---
        const canvasF = document.getElementById('flappyCanvas');
        const ctxF = canvasF.getContext('2d');
        const restartFlappyBtn = document.getElementById('restart-flappy');

        let bird, pipes, frameF, scoreF, flappyLoop, isFlappyOver;

        function initFlappy() {
            bird = { x: 50, y: 150, width: 20, height: 20, gravity: 0.35, jump: -6.5, velocity: 0 };
            pipes = [];
            frameF = 0;
            scoreF = 0;
            isFlappyOver = false;
            restartFlappyBtn.classList.remove('show');
        }

        function updateFlappy() {
            if (isFlappyOver) return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Colisão com chão e teto
            if (bird.y + bird.height >= canvasF.height || bird.y <= 0) {
                gameOverFlappy();
                return;
            }

            // Gerar canos
            if (frameF % 100 === 0) {
                let gap = 120;
                let topHeight = Math.floor(Math.random() * (canvasF.height - gap - 100)) + 30;
                pipes.push({ x: canvasF.width, top: topHeight, bottom: canvasF.height - topHeight - gap, passed: false });
            }

            // Mover e checar colisão dos canos
            pipes.forEach(pipe => {
                pipe.x -= 2;

                // Colisão
                if (bird.x < pipe.x + 40 && bird.x + bird.width > pipe.x &&
                   (bird.y < pipe.top || bird.y + bird.height > canvasF.height - pipe.bottom)) {
                    gameOverFlappy();
                }

                // Pontuação
                if (pipe.x + 40 < bird.x && !pipe.passed) {
                    scoreF++;
                    pipe.passed = true;
                }
            });

            // Remover canos fora da tela
            pipes = pipes.filter(pipe => pipe.x > -40);

            drawFlappy();
            frameF++;
            flappyLoop = requestAnimationFrame(updateFlappy);
        }

        function drawFlappy() {
            ctxF.fillStyle = '#70c5ce'; // Fundo Céu
            ctxF.fillRect(0, 0, canvasF.width, canvasF.height);

            // Desenhar Pássaro
            ctxF.fillStyle = '#ffeb3b';
            ctxF.fillRect(bird.x, bird.y, bird.width, bird.height);

            // Desenhar Canos
            ctxF.fillStyle = '#2e7d32';
            pipes.forEach(pipe => {
                ctxF.fillRect(pipe.x, 0, 40, pipe.top);
                ctxF.fillRect(pipe.x, canvasF.height - pipe.bottom, 40, pipe.bottom);
            });

            // Desenhar Placar
            ctxF.fillStyle = '#fff';
            ctxF.font = '20px sans-serif';
            ctxF.fillText(`Pontos: ${scoreF}`, 10, 30);
        }

        function gameOverFlappy() {
            isFlappyOver = true;
            cancelAnimationFrame(flappyLoop);
            alert(`Fim de jogo no Flappy Bird! Pontuação: ${scoreF}`);
            restartFlappyBtn.classList.add('show');
        }

        function startFlappy() {
            initFlappy();
            updateFlappy();
        }

        function flap() {
            if (!isFlappyOver && secFlappy.classList.contains('active')) {
                bird.velocity = bird.jump;
            }
        }

        restartFlappyBtn.addEventListener('click', startFlappy);
        window.addEventListener('keydown', e => { if (e.code === 'Space') flap(); });
        canvasF.addEventListener('click', flap);


        // --- 2. LÓGICA JOGO DA NAVE ---
        const canvasN = document.getElementById('naveCanvas');
        const ctxN = canvasN.getContext('2d');
        const restartNaveBtn = document.getElementById('restart-nave');

        let nave, bullets, enemies, scoreN, naveLoop, isNaveOver;
        let keysNave = {};

        function initNave() {
            nave = { x: 180, y: 360, width: 30, height: 20, speed: 5 };
            bullets = [];
            enemies = [];
            scoreN = 0;
            isNaveOver = false;
            restartNaveBtn.classList.remove('show');
        }

        function updateNave() {
            if (isNaveOver) return;

            if (keysNave['ArrowLeft'] && nave.x > 0) nave.x -= nave.speed;
            if (keysNave['ArrowRight'] && nave.x < canvasN.width - nave.width) nave.x += nave.speed;

            // Movimentar Balas
            bullets.forEach(b => b.y -= 7);
            bullets = bullets.filter(b => b.y > 0);

            // Gerar Inimigos
            if (Math.random() < 0.03) {
                enemies.push({ x: Math.random() * (canvasN.width - 20), y: 0, width: 20, height: 20, speed: 2 });
            }

            // Movimentar Inimigos e Tratar Colisões
            enemies.forEach((enemy, eIdx) => {
                enemy.y += enemy.speed;

                // Colisão com a nave
                if (enemy.x < nave.x + nave.width && enemy.x + enemy.width > nave.x &&
                    enemy.y < nave.y + nave.height && enemy.y + enemy.height > nave.y) {
                    gameOverNave();
                }

                // Colisão com balas
                bullets.forEach((bullet, bIdx) => {
                    if (bullet.x < enemy.x + enemy.width && bullet.x + 4 > enemy.x &&
                        bullet.y < enemy.y + enemy.height && bullet.y + 10 > enemy.y) {
                        enemies.splice(eIdx, 1);
                        bullets.splice(bIdx, 1);
                        scoreN += 10;
                    }
                });
            });

            // Remover inimigos fora da tela
            enemies = enemies.filter(e => e.y < canvasN.height);

            drawNave();
            naveLoop = requestAnimationFrame(updateNave);
        }

        function drawNave() {
            ctxN.fillStyle = '#000';
            ctxN.fillRect(0, 0, canvasN.width, canvasN.height);

            // Nave
            ctxN.fillStyle = '#00ff00';
            ctxN.fillRect(nave.x, nave.y, nave.width, nave.height);

            // Balas
            ctxN.fillStyle = '#ffff00';
            bullets.forEach(b => ctxN.fillRect(b.x, b.y, 4, 10));

            // Inimigos
            ctxN.fillStyle = '#ff0000';
            enemies.forEach(e => ctxN.fillRect(e.x, e.y, e.width, e.height));

            // Placar
            ctxN.fillStyle = '#fff';
            ctxN.font = '16px sans-serif';
            ctxN.fillText(`Pontos: ${scoreN}`, 10, 25);
        }

        function gameOverNave() {
            isNaveOver = true;
            cancelAnimationFrame(naveLoop);
            alert(`Fim de jogo na Nave! Pontuação: ${scoreN}`);
            restartNaveBtn.classList.add('show');
        }

        function startNave() {
            initNave();
            updateNave();
        }

        restartNaveBtn.addEventListener('click', startNave);

        window.addEventListener('keydown', e => {
            if (!secNave.classList.contains('active')) return;
            keysNave[e.key] = true;
            if (e.code === 'Space' && !isNaveOver) {
                bullets.push({ x: nave.x + nave.width / 2 - 2, y: nave.y });
            }
        });
        window.addEventListener('keyup', e => { keysNave[e.key] = false; });


        // --- 3. LÓGICA JOGO DA MEMÓRIA ---
        const gridM = document.getElementById('memory-grid');
        const restartMemoriaBtn = document.getElementById('restart-memoria');
        const items = ['🍕', '🍕', '🚗', '🚗', '🎈', '🎈', '🍦', '🍦', '🎸', '🎸', '🐶', '🐶', '🏀', '🏀', '💡', '💡'];
        
        let hasFlippedCard = false, lockBoard = false, firstCard, secondCard, matchesFound = 0;

        function createBoard() {
            gridM.innerHTML = '';
            items.sort(() => Math.random() - 0.5);
            items.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.framework = item;
                card.innerHTML = `<span>${item}</span>`;
                card.addEventListener('click', flipCard);
                gridM.appendChild(card);
            });
            matchesFound = 0;
            lockBoard = false;
            hasFlippedCard = false;
            restartMemoriaBtn.classList.remove('show');
        }

        function flipCard() {
            if (lockBoard || this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            matchesFound++;

            if (matchesFound === items.length / 2) {
                setTimeout(() => {
                    alert('Parabéns! Você concluiu o Jogo da Memória.');
                    restartMemoriaBtn.classList.add('show');
                }, 500);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function startMemoryGame() {
            createBoard();
        }

        restartMemoriaBtn.addEventListener('click', startMemoryGame);


        // INICIALIZAÇÃO (Inicia no Flappy Bird)
        startFlappy();

    </script>
</body>
</html>
