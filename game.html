<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Jogos - Jogo da Memória</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Painel do Topo (Status & Saldo) */
    .dashboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }

    .balance-box {
      text-align: left;
    }

    .balance-title { font-size: 12px; color: #aaa; text-transform: uppercase; }
    .balance-value { font-size: 22px; font-weight: bold; color: #2ecc71; }

    .mode-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .mode-real { background-color: #27ae60; color: #fff; }
    .mode-demo { background-color: #e67e22; color: #fff; }

    /* Indicadores do Jogo */
    .stats {
      display: flex;
      justify-content: space-around;
      background: #252525;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .stat-item { font-size: 14px; }
    .stat-value { font-size: 18px; font-weight: bold; color: #f39c12; }

    /* Tabuleiro do Jogo */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 0 auto 20px;
    }

    .card {
      aspect-ratio: 1;
      background-color: #2c3e50;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, background-color 0.2s;
    }

    .card.flipped {
      background-color: #34495e;
      cursor: default;
    }

    .card.matched {
      background-color: #27ae60;
      cursor: default;
    }

    /* Botões */
    .btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin: 5px;
    }

    .btn:hover { background-color: #2980b9; }
    .btn-recharge { background-color: #e74c3c; display: none; }
    .btn-recharge:hover { background-color: #c0392b; }

    /* Mensagem de Fim de Jogo */
    #msg-modal {
      display: none;
      background: #1e1e1e;
      border: 1px solid #444;
      padding: 20px;
      border-radius: 12px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Painel de Saldo e Modo -->
    <div class="dashboard">
      <div class="balance-box">
        <div class="balance-title">Saldo para Jogar</div>
        <div class="balance-value" id="game-balance">R$ --,--</div>
      </div>
      <div id="game-mode" class="mode-badge mode-real">Carregando...</div>
    </div>

    <!-- Indicadores da Partida -->
    <div class="stats">
      <div class="stat-item">Pontos: <span id="score-val" class="stat-value">0</span></div>
      <div class="stat-item">Erros: <span id="errors-val" class="stat-value" style="color: #e74c3c;">0</span></div>
      <div class="stat-item">Pares: <span id="pairs-val" class="stat-value">0/8</span></div>
    </div>

    <!-- Tabuleiro -->
    <div class="grid" id="grid"></div>

    <!-- Ações e Mensagens -->
    <button class="btn" onclick="restartGame()">Reiniciar Partida</button>
    <button id="btn-recharge" class="btn btn-recharge" onclick="rechargeNotice()">⚡ Recarregar Saldo</button>

    <div id="msg-modal">
      <h3 id="modal-title" style="margin-top: 0;"></h3>
      <p id="modal-desc"></p>
    </div>
  </div>

  <script>
    const EMOJIS = ['🚀', '💎', '🔥', '🏆', '🎰', '⚡', '🎯', '👑'];
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let errors = 0;
    let score = 0;
    let lockBoard = false;
    let userBalance = 0;

    // Cole o seu link de checkout da Kiwify de recarga entre as aspas abaixo:
    const KIWIFY_RECHARGE_URL = 'https://pay.kiwify.com.br/SEU_LINK_DE_RECARGA';

    const token = localStorage.getItem('token');

    // Inicialização
    window.onload = () => {
      if (!token) {
        alert('Faça login para jogar!');
        window.location.href = '/index.html';
        return;
      }
      fetchBalance();
      initGame();
    };

    // 1. Consulta o saldo atual no servidor
    async function fetchBalance() {
      try {
        const res = await fetch('/game/balance', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (res.ok) {
          userBalance = data.balance;
          updateDashboard();
        }
      } catch (err) {
        console.error('Erro ao buscar saldo:', err);
      }
    }

    // 2. Atualiza a interface com o saldo e modo atual
    function updateDashboard() {
      const balanceEl = document.getElementById('game-balance');
      const modeEl = document.getElementById('game-mode');
      const rechargeBtn = document.getElementById('btn-recharge');

      balanceEl.innerText = `R$ ${userBalance.toFixed(2)}`;

      if (userBalance > 0) {
        modeEl.innerText = 'Modo Valendo Dinheiro';
        modeEl.className = 'mode-badge mode-real';
        rechargeBtn.style.display = 'none';
      } else {
        modeEl.innerText = 'Modo Treino (Ranking)';
        modeEl.className = 'mode-badge mode-demo';
        rechargeBtn.style.display = 'inline-block';
      }
    }

    // 3. Inicializa o tabuleiro do jogo
    function initGame() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      
      const deck = [...EMOJIS, ...EMOJIS].sort(() => Math.random() - 0.5);
      cards = [];
      flippedCards = [];
      matchedPairs = 0;
      errors = 0;
      score = 0;
      lockBoard = false;

      document.getElementById('score-val').innerText = '0';
      document.getElementById('errors-val').innerText = '0';
      document.getElementById('pairs-val').innerText = '0/8';
      document.getElementById('msg-modal').style.display = 'none';

      deck.forEach((symbol, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.symbol = symbol;
        card.dataset.index = index;
        card.addEventListener('click', flipCard);
        grid.appendChild(card);
        cards.push(card);
      });
    }

    // 4. Lógica de virar a carta
    function flipCard() {
      if (lockBoard) return;
      if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

      this.classList.add('flipped');
      this.innerText = this.dataset.symbol;
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    // 5. Verifica correspondência dos pares
    function checkMatch() {
      lockBoard = true;
      const [card1, card2] = flippedCards;

      if (card1.dataset.symbol === card2.dataset.symbol) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        score += 100;
        
        document.getElementById('score-val').innerText = score;
        document.getElementById('pairs-val').innerText = `${matchedPairs}/8`;
        flippedCards = [];
        lockBoard = false;

        if (matchedPairs === EMOJIS.length) {
          finishGame();
        }
      } else {
        errors++;
        document.getElementById('errors-val').innerText = errors;
        
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          card1.innerText = '';
          card2.innerText = '';
          flippedCards = [];
          lockBoard = false;
        }, 1000);
      }
    }

    // 6. Envia o resultado para o servidor
    async function finishGame() {
      try {
        const res = await fetch('/game/score', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ score, errors })
        });

        const data = await res.json();

        if (res.ok) {
          userBalance = data.remainingBalance;
          updateDashboard();

          const modal = document.getElementById('msg-modal');
          document.getElementById('modal-title').innerText = '🎉 Partida Finalizada!';
          document.getElementById('modal-desc').innerText = data.message;
          modal.style.display = 'block';
        }
      } catch (err) {
        console.error('Erro ao finalizar jogo:', err);
      }
    }

    function restartGame() {
      initGame();
    }

    // Redireciona para o checkout de recarga da Kiwify
    function rechargeNotice() {
      if (confirm('Deseja fazer uma recarga de saldo via PIX para continuar jogando valendo dinheiro?')) {
        window.open(KIWIFY_RECHARGE_URL, '_blank');
      }
    }
  </script>
</body>
</html>
