<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Jogos - Jogo da Memória</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #1a1a1a; 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        .nav-header { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #333; 
            padding: 10px 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }

        .nav-header h2 { 
            margin: 0; 
        }

        /* Estilos do Pote de Ouro e Ranking */
        .pote-container {
            background-color: #252525;
            border: 2px solid #ffb703;
            border-radius: 12px;
            padding: 15px 20px;
            max-width: 380px;
            margin: 0 auto 25px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .pote-container h2 {
            color: #ffb703;
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .pote-container p {
            font-size: 11px;
            color: #aaa;
            margin: 0 0 15px 0;
        }

        .pote-container h3 {
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            text-align: left;
            font-size: 14px;
            margin: 10px 0 8px 0;
            color: #fff;
        }

        .ranking-list {
            padding-left: 20px;
            text-align: left;
            font-size: 13px;
            line-height: 1.8;
            margin: 0;
        }

        /* Estilos do Jogo da Memória */
        #memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 80px); 
            gap: 10px; 
            justify-content: center; 
            margin-top: 20px; 
        }

        .card { 
            width: 80px; 
            height: 80px; 
            background-color: #444; 
            border-radius: 8px; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 2em; 
            color: transparent; 
            user-select: none; 
            transition: background-color 0.3s; 
        }

        .card.flipped { 
            background-color: #fff; 
            color: #333; 
            cursor: default; 
        }

        .card.matched { 
            background-color: #2e7d32; 
            color: #fff; 
            cursor: default; 
            animation: pulse 0.5s; 
        }

        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.1); } 
            100% { transform: scale(1); } 
        }

        /* Botão Reiniciar */
        .restart-btn { 
            background-color: #f44336; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            margin-top: 20px; 
            font-size: 16px; 
            display: none; 
        }

        .restart-btn.show { 
            display: inline-block; 
        }

        .restart-btn:hover { 
            background-color: #d32f2f; 
        }
    </style>
</head>
<body>

    <div class="nav-header">
        <h2>Área de Jogos</h2>
    </div>

    <!-- PAINEL DO POTE DE OURO E RANKING -->
    <div class="pote-container">
        <h2>🏆 Pote de Ouro: R$ <span id="pote-valor">0,00</span></h2>
        <p>+ R$ 5,00 acumulados por cada novo assinante ativo!</p>

        <h3>Top 10 Jogadores</h3>
        <ol id="ranking-lista" class="ranking-list">
            <li>Carregando ranking...</li>
        </ol>
    </div>

    <!-- SEÇÃO DO JOGO DA MEMÓRIA -->
    <div id="section-memoria">
        <h3>Jogo da Memória</h3>
        <p>Encontre os pares de emoticons.</p>
        
        <div id="memory-grid">
            <!-- Cartas geradas via JS -->
        </div>

        <button id="restart-memoria" class="restart-btn">Reiniciar Jogo</button>
    </div>

    <script>
        const API_URL = 'https://plataforma-jogos-jpz5.onrender.com';
        const grid = document.getElementById('memory-grid');
        const restartMemoriaBtn = document.getElementById('restart-memoria');
        
        // Pares de emoticons
        const items = ['🍕', '🍕', '🚗', '🚗', '🎈', '🎈', '🍦', '🍦', '🎸', '🎸', '🐶', '🐶', '🏀', '🏀', '💡', '💡'];
        
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchesFound = 0;

        // Variáveis de tempo e precisão
        let startTime;
        let wrongAttempts = 0;

        // --- BUSCA POTE DE OURO E RANKING ---
        async function carregarRankingEPote() {
            try {
                const res = await fetch(`${API_URL}/game/leaderboard`);
                const data = await res.json();

                // Atualiza o Pote
                const valorPote = typeof data.poteDeOuro === 'number' ? data.poteDeOuro : 0;
                document.getElementById('pote-valor').innerText = valorPote.toFixed(2).replace('.', ',');

                // Atualiza o Ranking
                const lista = document.getElementById('ranking-lista');
                lista.innerHTML = '';

                if (!data.ranking || data.ranking.length === 0) {
                    lista.innerHTML = '<li>Nenhum jogador no ranking ainda. Seja o primeiro!</li>';
                    return;
                }

                data.ranking.forEach(user => {
                    lista.innerHTML += `<li><strong>${user.nome}</strong> — ${user.pontos} pts</li>`;
                });
            } catch (err) {
                console.error('Erro ao buscar leaderboard:', err);
                document.getElementById('ranking-lista').innerHTML = '<li>Erro ao carregar o ranking.</li>';
            }
        }

        // --- ENVIA A PONTUAÇÃO AO SERVIDOR ---
        async function enviarPontuacao(pontos) {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const res = await fetch(`${API_URL}/game/score`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ score: pontos })
                });

                const data = await res.json();

                if (data.newRecord) {
                    alert('🔥 Novo recorde pessoal registrado no ranking!');
                }

                // Atualiza a lista do ranking na tela
                carregarRankingEPote();
            } catch (err) {
                console.error('Erro ao enviar pontuação:', err);
            }
        }

        function shuffle(array) {
            array.sort(() => Math.random() - 0.5);
        }

        function createBoard() {
            grid.innerHTML = ''; // Limpa o tabuleiro existente
            shuffle(items);
            items.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.framework = item;
                card.innerHTML = `<span class="front-face">${item}</span>`;
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
            matchesFound = 0;
            wrongAttempts = 0; // Reseta os erros do jogo anterior
            startTime = Date.now(); // Inicia o cronômetro da partida
            lockBoard = false;
            hasFlippedCard = false;
            restartMemoriaBtn.classList.remove('show');
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                // Primeiro clique
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Segundo clique
            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');

            matchesFound++;
            
            // Verificação de fim de jogo
            if (matchesFound === items.length / 2) {
                const timeSpentSeconds = Math.floor((Date.now() - startTime) / 1000);
                
                // Cálculo: Base (800) + Bônus Tempo (300 - tempo) - Penalidade (10 por erro)
                const baseScore = 800;
                const timeBonus = Math.max(0, 300 - timeSpentSeconds);
                const errorPenalty = wrongAttempts * 10;
                const finalScore = Math.max(100, baseScore + timeBonus - errorPenalty);

                setTimeout(() => {
                    alert(`Parabéns! Você concluiu em ${timeSpentSeconds}s com ${wrongAttempts} erro(s).\nPontuação: ${finalScore} pts!`);
                    
                    // Envia os pontos para o servidor
                    enviarPontuacao(finalScore);
                    
                    restartMemoriaBtn.classList.add('show');
                }, 500);
            }

            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            wrongAttempts++; // Incrementa contador de erros
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function startMemoryGame() {
            createBoard();
        }

        // Evento do botão reiniciar manual
        restartMemoriaBtn.addEventListener('click', startMemoryGame);

        // Inicializa o jogo e carrega o painel de ranking ao abrir a página
        startMemoryGame();
        carregarRankingEPote();
    </script>
</body>
</html>
