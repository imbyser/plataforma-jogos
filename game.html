<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plataforma de Jogos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .status-badge {
      background-color: #28a745;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .btn-logout {
      background-color: #dc3545;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 500px;
    }
    .nav-btn {
      flex: 1;
      padding: 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .game-container {
      background-color: #1e1e1e;
      padding: 16px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      background-color: #000;
      border-radius: 8px;
      width: 100%;
      max-width: 320px;
      height: auto;
      aspect-ratio: 1 / 1;
    }
    /* Controles virtuais do Celular */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 16px;
      width: 200px;
    }
    .ctrl-btn {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 15px;
      font-size: 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }
    .ctrl-btn:active {
      background-color: #555;
    }
    .empty { visibility: hidden; }
  </style>
</head>
<body>

  <header>
    <h2>🎮 Jogos</h2>
    <div>
      <span class="status-badge">Assinatura Ativa</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="nav-buttons">
    <button class="nav-btn" onclick="showSnake()">Jogo da Cobrinha</button>
    <button class="nav-btn" onclick="showMemory()">Jogo da Memória</button>
  </div>

  <div class="game-container">
    <h3 id="game-title">Jogo da Cobrinha</h3>
    <p style="margin: 8px 0; font-size: 0.9rem; color: #aaa;">Use as setas virtuais ou do teclado</p>
    
    <canvas id="snakeCanvas" width="320" height="320"></canvas>

    <!-- Controles virtuais (Touch) -->
    <div class="controls" id="touchControls">
      <div class="empty"></div>
      <button class="ctrl-btn" onclick="setDirection('UP')">⬆️</button>
      <div class="empty"></div>
      <button class="ctrl-btn" onclick="setDirection('LEFT')">⬅️</button>
      <div class="ctrl-btn empty"></div>
      <button class="ctrl-btn" onclick="setDirection('RIGHT')">➡️</button>
      <div class="empty"></div>
      <button class="ctrl-btn" onclick="setDirection('DOWN')">⬇️</button>
      <div class="empty"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 16;
    let snake = [{x: 160, y: 160}];
    let food = {x: 80, y: 80};
    let dx = gridSize, dy = 0;

    function gameLoop() {
      setTimeout(() => {
        clearCanvas();
        moveSnake();
        drawFood();
        drawSnake();
        if(!checkGameOver()) {
          gameLoop();
        } else {
          alert('Fim de jogo! Reiniciando...');
          resetGame();
        }
      }, 150);
    }

    function clearCanvas() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      ctx.fillStyle = '#28a745';
      snake.forEach(part => ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2));
    }

    function drawFood() {
      ctx.fillStyle = '#dc3545';
      ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);
    }

    function moveSnake() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        food = {
          x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
          y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize
        };
      } else {
        snake.pop();
      }
    }

    function checkGameOver() {
      const head = snake[0];
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) return true;
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) return true;
      }
      return false;
    }

    function resetGame() {
      snake = [{x: 160, y: 160}];
      dx = gridSize;
      dy = 0;
      gameLoop();
    }

    function setDirection(dir) {
      if (dir === 'LEFT' && dx === 0) { dx = -gridSize; dy = 0; }
      if (dir === 'UP' && dy === 0) { dx = 0; dy = -gridSize; }
      if (dir === 'RIGHT' && dx === 0) { dx = gridSize; dy = 0; }
      if (dir === 'DOWN' && dy === 0) { dx = 0; dy = gridSize; }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') setDirection('LEFT');
      if (e.key === 'ArrowUp') setDirection('UP');
      if (e.key === 'ArrowRight') setDirection('RIGHT');
      if (e.key === 'ArrowDown') setDirection('DOWN');
    });

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/';
    }

    // Inicializar Jogo
    gameLoop();
  </script>
</body>
</html>
