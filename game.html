<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Jogos - Jogo da Memória</title>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #1a1a1a; 
            color: white; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }

        .nav-header { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #333; 
            padding: 10px 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }

        .nav-header h2 { 
            margin: 0; 
        }

        /* Estilos do Jogo da Memória */
        #memory-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 80px); 
            gap: 10px; 
            justify-content: center; 
            margin-top: 20px; 
        }

        .card { 
            width: 80px; 
            height: 80px; 
            background-color: #444; 
            border-radius: 8px; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 2em; 
            color: transparent; 
            user-select: none; 
            transition: background-color 0.3s; 
        }

        .card.flipped { 
            background-color: #fff; 
            color: #333; 
            cursor: default; 
        }

        .card.matched { 
            background-color: #2e7d32; 
            color: #fff; 
            cursor: default; 
            animation: pulse 0.5s; 
        }

        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.1); } 
            100% { transform: scale(1); } 
        }

        /* Botão Reiniciar */
        .restart-btn { 
            background-color: #f44336; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            margin-top: 20px; 
            font-size: 16px; 
            display: none; 
        }

        .restart-btn.show { 
            display: inline-block; 
        }

        .restart-btn:hover { 
            background-color: #d32f2f; 
        }
    </style>
</head>
<body>

    <div class="nav-header">
        <h2>Área de Jogos</h2>
    </div>

    <!-- SEÇÃO DO JOGO DA MEMÓRIA -->
    <div id="section-memoria">
        <h3>Jogo da Memória</h3>
        <p>Encontre os pares de emoticons.</p>
        
        <div id="memory-grid">
            <!-- Cartas geradas via JS -->
        </div>

        <button id="restart-memoria" class="restart-btn">Reiniciar Jogo</button>
    </div>

    <script>
        const grid = document.getElementById('memory-grid');
        const restartMemoriaBtn = document.getElementById('restart-memoria');
        
        // Pares de emoticons
        const items = ['🍕', '🍕', '🚗', '🚗', '🎈', '🎈', '🍦', '🍦', '🎸', '🎸', '🐶', '🐶', '🏀', '🏀', '💡', '💡'];
        
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matchesFound = 0;

        function shuffle(array) {
            array.sort(() => Math.random() - 0.5);
        }

        function createBoard() {
            grid.innerHTML = ''; // Limpa o tabuleiro existente
            shuffle(items);
            items.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.framework = item;
                card.innerHTML = `<span class="front-face">${item}</span>`;
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
            matchesFound = 0;
            lockBoard = false;
            hasFlippedCard = false;
            restartMemoriaBtn.classList.remove('show');
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                // Primeiro clique
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            // Segundo clique
            secondCard = this;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.framework === secondCard.dataset.framework;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);
            
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');

            matchesFound++;
            
            // Verificação de fim de jogo
            if (matchesFound === items.length / 2) {
                setTimeout(() => {
                    alert('Parabéns! Você encontrou todos os pares do Jogo da Memória.');
                    restartMemoriaBtn.classList.add('show');
                }, 500);
            }

            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 1000);
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function startMemoryGame() {
            createBoard();
        }

        // Evento do botão reiniciar manual
        restartMemoriaBtn.addEventListener('click', startMemoryGame);

        // Inicializa o jogo ao carregar a página
        startMemoryGame();
    </script>
</body>
</html>
